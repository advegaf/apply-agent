# drift.example.conf — copy to drift.conf (gitignored).
#
# Cross-variant drift detection. Each line declares a figure that appears in more
# than one PDF; build.sh extracts it from every variant containing it and fails if
# they disagree. This is what catches "890+" in one file and "850+" in another.
#
# Format:  <extended-regex> | <label>
# Use anchored exact figures, not generic patterns: a bare '[0-9]+ unit tests'
# reports false drift when two variants lead with different projects.

890\+ payments        | payments-count
\$24K\+               | revenue-processed
[0-9]+\+ registered members | registered-members
