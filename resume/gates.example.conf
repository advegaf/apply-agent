# gates.conf.example — candidate content gates for resume/build.sh
#
# Copy to gates.conf (gitignored) and rewrite for YOUR resume. Each line asserts
# something that must, or must not, appear in the extracted text of one variant.
# This is how you stop a stale claim, a dead link, or a confidential term from
# shipping in a PDF without noticing.
#
# Format:  <variant> <want|wantnot> <string> | <description>
# variant: ios | be | prod | gs
#
# The examples below are a FICTIONAL candidate. Replace all of them.

prod want    riverside-meals.com          | side business is a linked project
prod wantnot Founder and Engineer         | side business sits under Projects, not Experience
ios  want    Live on TestFlight           | unreleased apps say TestFlight, not App Store
ios  wantnot id1234567890                 | no dead App Store id for the unreleased app
be   want    I did not write              | forked project is framed as someone else's code
be   wantnot AcmeVendorName               | employer vendor names never reach the page
gs   wantnot Return offer                 | employer-facing variant drops the offer line

# 17 gates were extracted from the original build.sh when this repo was created.
